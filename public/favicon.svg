<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#caf0f8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGrad)" />

  <!-- Fish body -->
  <ellipse cx="30" cy="32" rx="16" ry="10" fill="url(#fishGrad)" />

  <!-- Fish tail -->
  <polygon points="14,32 6,22 6,42" fill="url(#fishGrad)" opacity="0.9" />

  <!-- Fish fin (top) -->
  <path d="M22,22 Q30,14 36,22" fill="white" opacity="0.7" />

  <!-- Fish eye -->
  <circle cx="40" cy="30" r="3" fill="white" />
  <circle cx="41" cy="29.5" r="1.5" fill="#023e8a" />

  <!-- Fish mouth -->
  <path d="M46,32 Q48,35 46,37" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Shine/scales -->
  <ellipse cx="28" cy="30" rx="4" ry="3" fill="white" opacity="0.15" transform="rotate(-20,28,30)" />

  <!-- Small bubbles -->
  <circle cx="50" cy="20" r="2" fill="white" opacity="0.5" />
  <circle cx="55" cy="26" r="1.5" fill="white" opacity="0.4" />
  <circle cx="52" cy="15" r="1" fill="white" opacity="0.3" />
</svg>